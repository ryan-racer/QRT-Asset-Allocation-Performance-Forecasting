[project]
name = "asset-allocation-performance-forecasting"
version = "0.1.0"
description = "QRT asset allocation performance forecasting challenge materials and benchmark"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ipykernel>=6.29.0",
    "lightgbm>=4.5.0",
    "matplotlib>=3.9.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "scikit-learn>=1.5.0",
    "seaborn>=0.13.2",
]

[dependency-groups]
dev = [
    "nbconvert>=7.17.1",
    "nbformat>=5.11.1",
]
